<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Click Me Fast</h1>                                   <!--THIS LINE IS GIVING THE TITLE NAME TO SITE-->
    <script>                                                            
        document.getElementById("title").onclick = function () {
            alert("javascript is fun and good");
        };
    </script>
</body>
</html>

<!--THIS SCRIPT IS MAKING THE CLICK ON SITE DIRECTLY AND SHOWING THE POPUP OF "javascript is fun and good"-->
